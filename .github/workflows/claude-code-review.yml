name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push to the same PR supersedes an in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not exposed to fork PRs, so the review can only run on same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Set one of these repository secrets (Settings → Secrets and variables → Actions).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md and AGENTS.md first and hold the
            change to the project rules they state, in particular:
            - The agent is a page renderer triggered only by signed GitHub
              `deployment_status` webhooks (agent/channels/github-deployment.ts).
              Flag anything that re-enables the default eve HTTP channel, adds chat
              routes, or weakens webhook signature verification.
            - The agent never classifies. Numbers under data/ are generated by
              scripts/build_discourse.py; flag hand edits to data/ or classification
              logic creeping into agent code.

            Focus on correctness bugs, security issues, and missing or broken tests
            (test/*.test.ts). Skip pure style nits unless they hide a bug.

            Use inline comments for specific issues, and one top-level summary
            comment with the overall verdict. If nothing is wrong, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
